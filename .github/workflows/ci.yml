name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Knowledge base is present and non-empty
        run: test -s data/knowledge_base.jsonl

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t chatbot:ci .
      - name: Smoke test container
        run: |
          docker run -d --name chatbot -p 8000:8000 chatbot:ci
          for i in $(seq 1 20); do
            curl -fs http://localhost:8000/api/health && exit 0
            sleep 1
          done
          docker logs chatbot
          exit 1
