<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DarGlobal x Wasalt Assistant</title>
<meta name="description" content="RAG chatbot answering questions from publicly available DarGlobal and Wasalt website data.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23b8893b'/%3E%3Ctext x='50' y='68' font-size='56' font-family='Georgia,serif' text-anchor='middle' fill='white'%3ED%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f4ef; --panel: #ffffff; --ink: #1c1b19; --muted: #6d6a63; --line: #e4e0d6;
    --accent: #b8893b; --accent-ink: #ffffff; --accent-soft: #f4ead6;
    --user: #1f2a37; --user-ink: #ffffff; --bot: #ffffff; --danger: #b3261e;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.05);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111214; --panel: #1a1c1f; --ink: #ecebe8; --muted: #9a978f; --line: #2b2e32;
      --accent: #d4a24c; --accent-ink: #1a1306; --accent-soft: #2a2417;
      --user: #2b3544; --user-ink: #f2f2f2; --bot: #1a1c1f; --danger: #f2a49f;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; align-items: center; gap: 12px;
  }
  header > div:nth-child(2) { min-width: 0; }
  header h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .logo { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font: 700 20px Georgia, serif; flex: none; }
  header h1 { font-size: 16px; margin: 0; line-height: 1.2; }
  header p { margin: 0; font-size: 12.5px; color: var(--muted); }
  .spacer { flex: 1; }
  .btn {
    border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 10px;
    padding: 7px 12px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .btn:hover { background: var(--accent-soft); }
  .btn:focus-visible, textarea:focus-visible, a:focus-visible, .chip:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  main { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  #thread { max-width: 820px; margin: 0 auto; padding: 24px 16px 12px; display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; gap: 10px; }
  .row.user { justify-content: flex-end; }
  .avatar { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font: 700 15px Georgia, serif; flex: none; margin-top: 2px; }
  .bubble { max-width: min(680px, 92%); padding: 11px 15px; border-radius: var(--radius); word-wrap: break-word; overflow-wrap: anywhere; }
  .user .bubble { background: var(--user); color: var(--user-ink); border-bottom-right-radius: 5px; white-space: pre-wrap; }
  .bot .bubble { background: var(--bot); border: 1px solid var(--line); box-shadow: var(--shadow); border-top-left-radius: 5px; }
  .bubble p { margin: 0 0 .7em; } .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: .3em 0 .7em; padding-left: 1.3em; } .bubble li { margin: .15em 0; }
  .bubble h3, .bubble h4 { margin: .8em 0 .3em; font-size: 15px; }
  .bubble code { background: var(--accent-soft); padding: 1px 5px; border-radius: 5px; font-size: .92em; }
  .bubble pre { background: var(--accent-soft); padding: 10px 12px; border-radius: 10px; overflow-x: auto; }
  .bubble pre code { background: none; padding: 0; }
  .bubble a { color: var(--accent); }
  sup.cite { font-size: .72em; } sup.cite a { text-decoration: none; font-weight: 600; padding: 0 1px; }
  .error .bubble { border-color: var(--danger); color: var(--danger); }
  .meta { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .meta small { color: var(--muted); font-size: 12px; margin-right: 2px; }
  .src { display: inline-flex; gap: 6px; align-items: center; max-width: 100%; border: 1px solid var(--line); border-radius: 999px;
    padding: 3px 10px 3px 4px; font-size: 12px; color: var(--ink); text-decoration: none; background: var(--panel); }
  .src:hover { border-color: var(--accent); background: var(--accent-soft); }
  .src b { background: var(--accent); color: var(--accent-ink); border-radius: 999px; min-width: 18px; height: 18px;
    display: inline-grid; place-items: center; font-size: 11px; flex: none; }
  .src span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 230px; }
  .src i { color: var(--muted); font-style: normal; font-size: 11px; flex: none; }
  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
  .welcome { text-align: center; padding: 28px 8px 8px; }
  .welcome h2 { margin: 0 0 6px; font-size: 22px; }
  .welcome p { margin: 0 auto 18px; color: var(--muted); max-width: 560px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 8px 14px;
    font: inherit; font-size: 13.5px; cursor: pointer; box-shadow: var(--shadow); }
  .chip:hover { border-color: var(--accent); background: var(--accent-soft); }
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  form { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; max-height: 160px; min-height: 46px; padding: 12px 14px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; line-height: 1.4;
  }
  #send { width: 46px; height: 46px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink);
    cursor: pointer; display: grid; place-items: center; flex: none; }
  #send:disabled { opacity: .45; cursor: not-allowed; }
  #send.stop { background: var(--user); color: var(--user-ink); }
  .foot-note { max-width: 820px; margin: 8px auto 0; font-size: 11.5px; color: var(--muted); text-align: center; }
  @media (max-width: 560px) { header p { display: none; } .src span { max-width: 140px; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true">D</div>
  <div>
    <h1>DarGlobal x Wasalt Assistant</h1>
    <p>Answers grounded in public data from darglobal.co.uk and wasalt.sa</p>
  </div>
  <div class="spacer"></div>
  <button class="btn" id="clear" type="button" title="Start a new conversation">New chat</button>
</header>

<main id="main">
  <div id="thread" role="log" aria-live="polite" aria-label="Conversation"></div>
</main>

<footer>
  <form id="form" autocomplete="off">
    <textarea id="input" rows="1" maxlength="1000" placeholder="Ask about DarGlobal or Wasalt..." aria-label="Your message" required></textarea>
    <button id="send" type="submit" aria-label="Send message">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </form>
  <div class="foot-note" id="foot">AI-generated answers from a website snapshot - verify important details on the official sites.</div>
</footer>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const thread = $("thread"), main = $("main"), input = $("input"), form = $("form"), sendBtn = $("send");
  const STORE = "dg-wasalt-chat-v1";
  const SUGGESTIONS = [
    "Who is DarGlobal and where does it build?",
    "Which luxury brands does DarGlobal partner with?",
    "Tell me about DarGlobal's projects in Oman",
    "What is Wasalt and what services does it offer?",
    "How do auctions work on Wasalt?",
    "What are apartments for sale in Riyadh like on Wasalt?"
  ];
  const SEND_ICON = sendBtn.innerHTML;
  const STOP_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>';

  let history = [];       // [{role, content}] sent to the API
  let busy = false;
  let controller = null;

  /* ---------- safe markdown (escape first, then add a small subset of formatting) ---------- */
  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const safeUrl = (u) => (/^https?:\/\//i.test(u) ? u : null);

  function inline(text, sources) {
    let t = esc(text);
    t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
    t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    t = t.replace(/(^|[^*])\*([^*\s][^*]*)\*(?!\*)/g, "$1<em>$2</em>");
    t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (m, label, url) =>
      `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`);
    t = t.replace(/\[(\d{1,2})\]/g, (m, n) => {
      const s = sources.find((x) => x.n === Number(n));
      const url = s && safeUrl(s.url);
      return url ? `<sup class="cite"><a href="${esc(url)}" target="_blank" rel="noopener noreferrer" title="${esc(s.title)}">[${n}]</a></sup>` : m;
    });
    return t;
  }

  function markdown(src, sources) {
    const lines = src.replace(/\r\n/g, "\n").split("\n");
    const out = [];
    let list = null, para = [], code = null;
    const flushPara = () => { if (para.length) { out.push("<p>" + para.map((l) => inline(l, sources)).join("<br>") + "</p>"); para = []; } };
    const flushList = () => { if (list) { out.push(`</${list}>`); list = null; } };
    for (const line of lines) {
      if (/^```/.test(line)) {
        if (code === null) { flushPara(); flushList(); code = []; }
        else { out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>"); code = null; }
        continue;
      }
      if (code !== null) { code.push(line); continue; }
      let m;
      if ((m = line.match(/^\s*(#{1,4})\s+(.*)$/))) { flushPara(); flushList(); out.push(`<h3>${inline(m[2], sources)}</h3>`); }
      else if ((m = line.match(/^\s*[-*•]\s+(.*)$/))) { flushPara(); if (list !== "ul") { flushList(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inline(m[1], sources)}</li>`); }
      else if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { flushPara(); if (list !== "ol") { flushList(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inline(m[1], sources)}</li>`); }
      else if (!line.trim()) { flushPara(); flushList(); }
      else { flushList(); para.push(line); }
    }
    if (code !== null) out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>");
    flushPara(); flushList();
    return out.join("");
  }

  /* ---------- rendering ---------- */
  function scrollDown(force) {
    const near = main.scrollHeight - main.scrollTop - main.clientHeight < 140;
    if (force || near) main.scrollTop = main.scrollHeight;
  }

  function addRow(role, extraClass = "") {
    const row = document.createElement("div");
    row.className = `row ${role} ${extraClass}`.trim();
    if (role === "bot") { const a = document.createElement("div"); a.className = "avatar"; a.textContent = "D"; a.setAttribute("aria-hidden", "true"); row.appendChild(a); }
    const body = document.createElement("div");
    body.className = "bubble";
    row.appendChild(body);
    thread.appendChild(row);
    return { row, body };
  }

  function renderSources(container, sources) {
    if (!sources.length) return;
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.innerHTML = "<small>Sources</small>";
    for (const s of sources) {
      const url = safeUrl(s.url);
      if (!url) continue;
      const a = document.createElement("a");
      a.className = "src"; a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.title = s.snippet || s.title;
      a.innerHTML = `<b>${s.n}</b><span>${esc(s.title)}</span><i>${esc(s.site_label)}</i>`;
      meta.appendChild(a);
    }
    container.appendChild(meta);
  }

  function showWelcome() {
    const w = document.createElement("div");
    w.className = "welcome"; w.id = "welcome";
    w.innerHTML = "<h2>How can I help?</h2><p>Ask me about DarGlobal's luxury developments, partners and investor news, or Wasalt's property listings, auctions and services.</p>";
    const chips = document.createElement("div"); chips.className = "chips";
    for (const q of SUGGESTIONS) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = q;
      b.addEventListener("click", () => send(q));
      chips.appendChild(b);
    }
    w.appendChild(chips);
    thread.appendChild(w);
  }

  function persist() { try { sessionStorage.setItem(STORE, JSON.stringify(history.slice(-30))); } catch (_) {} }

  function restore() {
    try { history = JSON.parse(sessionStorage.getItem(STORE) || "[]"); } catch (_) { history = []; }
    if (!history.length) return showWelcome();
    for (const m of history) {
      const { body } = addRow(m.role === "user" ? "user" : "bot");
      if (m.role === "user") body.textContent = m.content;
      else body.innerHTML = markdown(m.content, []);
    }
    scrollDown(true);
  }

  function setBusy(v) {
    busy = v;
    sendBtn.disabled = false;
    sendBtn.classList.toggle("stop", v);
    sendBtn.innerHTML = v ? STOP_ICON : SEND_ICON;
    sendBtn.setAttribute("aria-label", v ? "Stop generating" : "Send message");
    input.disabled = v;
    if (!v) input.focus();
  }

  /* ---------- chat ---------- */
  async function send(text) {
    text = (text || "").trim();
    if (!text || busy) return;
    $("welcome")?.remove();

    const priorHistory = history.slice(-8);
    const u = addRow("user"); u.body.textContent = text;
    history.push({ role: "user", content: text });
    input.value = ""; autosize();

    const bot = addRow("bot");
    bot.body.innerHTML = '<div class="typing" aria-label="Assistant is typing"><span></span><span></span><span></span></div>';
    scrollDown(true);
    setBusy(true);
    controller = new AbortController();

    let answer = "", sources = [], started = false;
    try {
      const res = await fetch("/api/chat", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history: priorHistory, stream: true }),
        signal: controller.signal
      });
      if (!res.ok) {
        let msg = `Request failed (${res.status}).`;
        try { const j = await res.json(); if (j.detail) msg = typeof j.detail === "string" ? j.detail : "Invalid request."; } catch (_) {}
        if (res.status === 429) msg += " Please wait a moment and try again.";
        throw new Error(msg);
      }
      const reader = res.body.getReader(), decoder = new TextDecoder();
      let buf = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n\n")) !== -1) {
          const frame = buf.slice(0, idx); buf = buf.slice(idx + 2);
          const line = frame.split("\n").find((l) => l.startsWith("data:"));
          if (!line) continue;
          let ev; try { ev = JSON.parse(line.slice(5)); } catch (_) { continue; }
          if (ev.type === "sources") sources = ev.sources || [];
          else if (ev.type === "token") { answer += ev.text; started = true; bot.body.innerHTML = markdown(answer, sources); scrollDown(); }
          else if (ev.type === "error") throw new Error(ev.message || "Something went wrong.");
        }
      }
      if (!answer) throw new Error("The assistant returned an empty answer. Please try again.");
      bot.body.innerHTML = markdown(answer, sources);
      renderSources(bot.body, sources);
      history.push({ role: "assistant", content: answer });
    } catch (err) {
      if (err.name === "AbortError") {
        if (answer) { history.push({ role: "assistant", content: answer }); renderSources(bot.body, sources); }
        else { bot.row.remove(); u.row.remove(); history.pop(); input.value = text; autosize(); }
      } else {
        bot.row.classList.add("error");
        const note = esc(err.message || "Something went wrong.");
        bot.body.innerHTML = (started ? markdown(answer, sources) : "") + `<p>${note}</p>`;
        if (!started) history.pop(); // don't keep an unanswered turn in the context
      }
    } finally {
      controller = null; setBusy(false); persist(); scrollDown(true);
    }
  }

  function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; }

  form.addEventListener("submit", (e) => { e.preventDefault(); if (busy) { controller?.abort(); } else { send(input.value); } });
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } });
  $("clear").addEventListener("click", () => {
    controller?.abort(); history = []; persist(); thread.innerHTML = ""; showWelcome(); input.focus();
  });

  fetch("/api/info").then((r) => r.ok ? r.json() : null).then((i) => {
    if (!i || !i.chunks) return;
    const pages = Object.values(i.pages_per_site || {}).reduce((a, b) => a + b, 0);
    const date = i.last_scraped ? ` - scraped ${i.last_scraped.slice(0, 10)}` : "";
    $("foot").textContent = `Knowledge base: ${pages} pages / ${i.chunks} passages from darglobal.co.uk and wasalt.sa${date}. AI answers may contain errors - verify on the official sites.`;
  }).catch(() => {});

  restore();
  input.focus();
})();
</script>
</body>
</html>
